<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>논산 신학부 운영센터</title>
<meta name="theme-color" content="#1e3a8a">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --brand:#1e3a8a; --brand2:#2563eb;
  --ok:#059669; --okbg:#d1fae5; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; --soft:#eef2ff;
  --r:12px; --sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--brand2)}
.hidden{display:none!important}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:220px;background:var(--brand);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
#side h1{font-size:16px;margin:0 8px 18px;line-height:1.3}
#side h1 small{display:block;font-weight:400;opacity:.7;font-size:12px}
#side a{display:flex;gap:10px;align-items:center;color:#dbeafe;text-decoration:none;padding:9px 10px;border-radius:9px;margin-bottom:2px}
#side a.on,#side a:hover{background:rgba(255,255,255,.14);color:#fff}
#side .foot{margin-top:18px;font-size:12px;opacity:.75;padding:0 8px}
#side .foot button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;margin-top:6px;cursor:pointer}
main{flex:1;min-width:0;padding:22px 26px 90px}
#tabbar{display:none}
@media (max-width:860px){
  #side{display:none} main{padding:14px 12px 90px}
  #tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  #tabbar a{flex:1 0 64px;text-align:center;font-size:11px;color:var(--sub);text-decoration:none;padding:7px 2px}
  #tabbar a b{display:block;font-size:18px;font-weight:400}
  #tabbar a.on{color:var(--brand)}
}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:21px;flex:1;min-width:160px}
.sync{font-size:12px;color:var(--sub)}
/* cards & grid */
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f9fafb}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.p:hover{background:#1d4ed8}
.btn.d{color:var(--bad);border-color:#fecaca}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid #d1d5db;border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
label.f>*{font-size:14px;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
legend{font-size:13px;font-weight:600;padding:0 6px}
/* table */
.tw{overflow:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f9fafb;font-size:12px;color:var(--sub);position:sticky;top:0;z-index:1}
tr.click{cursor:pointer} tr.click:hover td{background:#f8fafc}
td.c,th.c{text-align:center} td.n{text-align:right}
.sticky1{position:sticky;left:0;background:#fff;z-index:2}
th.sticky1{z-index:3;background:#f9fafb}
/* badges */
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#f3f4f6;color:#374151}
.b.ok{background:var(--okbg);color:var(--ok)} .b.warn{background:var(--warnbg);color:var(--warn)} .b.bad{background:var(--badbg);color:var(--bad)} .b.blue{background:var(--soft);color:var(--brand)}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2)}
/* attendance */
.att{display:flex;gap:4px}
.att button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.att button.on.실시간{background:var(--ok);color:#fff;border-color:var(--ok)}
.att button.on.보강{background:#f59e0b;color:#fff;border-color:#f59e0b}
.att button.on.결석{background:var(--bad);color:#fff;border-color:var(--bad)}
.cell{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;text-align:center;font-size:12px;font-weight:700;cursor:pointer}
.cell.실시간{background:var(--okbg);color:var(--ok)} .cell.보강{background:var(--warnbg);color:var(--warn)} .cell.결석{background:var(--badbg);color:var(--bad)} .cell.none{background:#f3f4f6;color:#9ca3af}
.mob{display:none}
@media (max-width:860px){
  .attTbl tr:first-child{display:none}
  .attTbl tr{display:grid;grid-template-columns:1fr auto;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
  .attTbl td{border:0;padding:2px 0;white-space:normal}
  .attTbl td.hm{display:none}
  .attTbl td.memo{grid-column:1/-1}
  .attTbl td.memo .row{flex-wrap:nowrap}
  .attTbl td.memo input{flex:1}
  .attTbl .att button{padding:8px 11px}
  .mob{display:block}
}
.stick-save{position:sticky;bottom:70px;z-index:5;margin-top:12px}
@media (min-width:861px){.stick-save{bottom:12px}}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0;overflow-x:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--brand);border-color:var(--brand);font-weight:600}
/* modal */
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .box h3{margin:0 0 12px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* toast / loading */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
#toast.err{background:var(--bad)}
#loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand2),#93c5fd);z-index:70;animation:ld 1s linear infinite}
@keyframes ld{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{max-width:400px;width:100%;padding:26px}
#login h1{font-size:20px;margin:0 0 4px}
/* org chart */
.org ul{padding-top:18px;position:relative;display:flex;justify-content:center;margin:0;padding-left:0}
.org li{list-style:none;text-align:center;position:relative;padding:18px 6px 0}
.org li::before,.org li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid #cbd5e1;width:50%;height:18px}
.org li::after{right:auto;left:50%;border-left:2px solid #cbd5e1}
.org li:only-child::after,.org li:only-child::before{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:2px solid #cbd5e1;border-radius:0 6px 0 0}
.org li:first-child::after{border-radius:6px 0 0 0}
.org ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid #cbd5e1;height:18px}
.org .node{display:inline-block;border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:7px 12px;min-width:96px;cursor:pointer}
.org .node b{display:block;font-size:14px}
.org .node span{font-size:12px;color:var(--sub)}
.org .node.top{background:var(--brand);color:#fff;border-color:var(--brand)} .org .node.top span{color:#dbeafe}
.orgwrap{overflow:auto;padding:10px 0}
.hbar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.hbar .t{width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{flex:1;height:14px}
.guide{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px}
.guide div{margin:3px 0}
.empty{padding:30px;text-align:center;color:var(--sub)}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h1>논산 신학부 운영센터</h1>
    <p class="muted" style="margin-top:0">기수·수강생·출석·진도를 관리하고, 기록은 구글 시트에 저장됩니다.</p>
    <details style="margin:10px 0"><summary class="muted" style="font-size:12px">API 주소 (보통은 바꿀 필요 없음)</summary>
      <input id="lgUrl" style="width:100%;margin-top:6px" placeholder="https://script.google.com/macros/s/.../exec">
    </details>
    <label class="f">비밀번호 (처음 접속이면 지금 입력하는 값이 관리자 비밀번호가 됩니다)<input id="lgPw" type="password" autocomplete="current-password"></label>
    <label class="row muted" style="margin:10px 0 14px"><input type="checkbox" id="lgKeep" checked> 이 기기에서 로그인 유지</label>
    <button class="btn p" style="width:100%" id="lgBtn">들어가기</button>
    <p id="lgErr" style="color:var(--bad);font-size:13px"></p>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="side">
    <h1>논산 신학부<small>운영센터</small></h1>
    <div id="navLinks"></div>
    <div class="foot"><div id="syncAt"></div><button onclick="logout()">로그아웃</button></div>
  </nav>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
/* ════════════════ 기본 ════════════════ */
const NAV = [
  ['home','🏠','대시보드'],['cohorts','📚','기수'],['attend','✅','출석 체크'],['book','📋','출석부'],
  ['progress','📈','진도'],['students','👥','수강생'],['register','🎫','등록 판정'],['staff','🧭','사명자·조직도'],['analysis','📊','분석']
];
const STAGES = ['센터(등록전)','초등(등록)','중등','고등','입교','탈락'];
const ATT = ['실시간','보강','결석'];
let DB = null, LAST = '', ROUTE = {page:'home'};
const S = { cohort: localStorage.getItem('dc_cohort') || '' }; // 마지막으로 본 기수

const $ = s => document.querySelector(s);
const esc = v => String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => (v === '' || v === null || v === undefined || isNaN(v)) ? '-' : (Math.round(v * 1000) / 10) + '%';
const num = v => (v === '' || v === null || v === undefined) ? 0 : Number(v) || 0;
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); const t = new Date(y, m-1, d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };
const dow = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).getDay(); };
const DOW = ['일','월','화','수','목','금','토'];
function toast(msg, err) { const t = document.createElement('div'); t.id = 'toast'; if (err) t.className = 'err'; t.textContent = msg; document.querySelectorAll('#toast').forEach(x => x.remove()); document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600); }
function loading(on) { let l = $('#loading'); if (on && !l) { l = document.createElement('div'); l.id = 'loading'; document.body.appendChild(l); } if (!on && l) l.remove(); }

/* ════════════════ API ════════════════ */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwqvK_bKcaVfHq5AkIBIro7u3l-a7nDrdZqF1h8dXUg8ezL0UNXPCxDEJD-arbsv_Qu/exec';
const cfg = () => ({ url: localStorage.getItem('dc_url') || DEFAULT_API, pw: sessionStorage.getItem('dc_pw') || localStorage.getItem('dc_pw') || '' });
async function api(action, payload) {
  const c = cfg();
  loading(true);
  try {
    const res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: c.pw, action }, payload || {})) });
    const j = await res.json();
    if (!j.ok) { if (j.auth === false) { logout(true); } throw new Error(j.error || '오류'); }
    return j;
  } finally { loading(false); }
}
async function reload(silent) {
  const j = await api('all');
  DB = j.data; LAST = j.at;
  $('#syncAt').textContent = '동기화 ' + LAST.slice(5, 16);
  if (!silent) render();
}
async function save(table, rows, msg) {
  try { await api('upsert', { table, rows }); await reload(); toast(msg || '저장했습니다'); return true; }
  catch (e) { toast(e.message, true); return false; }
}
async function removeRec(table, keyValues, msg) {
  try { const r = await api('remove', { table, keyValues }); await reload(); toast((msg || '삭제했습니다') + (r.cascade ? ` (출석기록 ${r.cascade}건 포함)` : '')); return true; }
  catch (e) { toast(e.message, true); return false; }
}

/* ════════════════ 로그인 ════════════════ */
function showLogin(msg) { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lgUrl').value = cfg().url; $('#lgErr').textContent = msg || ''; }
function logout(expired) { sessionStorage.removeItem('dc_pw'); localStorage.removeItem('dc_pw'); showLogin(expired ? '비밀번호를 다시 입력해 주세요.' : ''); }
$('#lgBtn').onclick = async () => {
  const url = $('#lgUrl').value.trim(), pw = $('#lgPw').value;
  if (!/^https?:\/\//.test(url)) { $('#lgErr').textContent = 'API 주소를 입력해 주세요.'; return; }
  localStorage.setItem('dc_url', url);
  sessionStorage.setItem('dc_pw', pw);
  if ($('#lgKeep').checked) localStorage.setItem('dc_pw', pw); else localStorage.removeItem('dc_pw');
  try { await api('login'); start(); }
  catch (e) { $('#lgErr').textContent = e.message === 'Failed to fetch' ? 'API 주소에 연결할 수 없습니다. 주소와 배포 설정(액세스: 모든 사용자)을 확인하세요.' : e.message; }
};
$('#lgPw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lgBtn').click(); });

async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#navLinks').innerHTML = NAV.map(n => `<a href="#${n[0]}" data-p="${n[0]}">${n[1]} ${n[2]}</a>`).join('');
  $('#tabbar').innerHTML = NAV.map(n => `<a href="#${n[0]}" data-p="${n[0]}"><b>${n[1]}</b>${n[2].replace('사명자·조직도','사명자')}</a>`).join('');
  try { await reload(true); } catch (e) { showLogin(e.message); return; }
  route();
}
window.addEventListener('hashchange', route);
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || 'home').split('/');
  ROUTE = { page: h[0], arg: h[1], tab: h[2] };
  document.querySelectorAll('[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === ROUTE.page || (ROUTE.page === 'cohort' && a.dataset.p === 'cohorts')));
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (!DB) return;
  const f = PAGES[ROUTE.page] || PAGES.home;
  try { $('#view').innerHTML = f(); (AFTER[ROUTE.page] || (() => {}))(); }
  catch (e) { console.error(e); $('#view').innerHTML = `<div class="card">화면 오류: ${esc(e.message)}</div>`; }
}
const AFTER = {};

/* ════════════════ 데이터 도우미 ════════════════ */
const L = k => (DB.lists && DB.lists[k]) || [];
function cohorts() { return DB.cohort.slice().sort((a, b) => String(b['개강일']).localeCompare(String(a['개강일']))); }
function cohortOf(n) { return DB.cohort.find(c => String(c['기수명']) === String(n)); }
function statOf(n) { return (DB.cohortStats || []).find(c => String(c['기수명']) === String(n)) || {}; }
function defaultCohort() {
  if (S.cohort && cohortOf(S.cohort)) return S.cohort;
  const cs = cohorts(); const on = cs.find(c => c['상태'] === '진행중');
  return on ? on['기수명'] : (cs[0] ? cs[0]['기수명'] : '');
}
function setCohort(n) { S.cohort = n; localStorage.setItem('dc_cohort', n); }
function studentsOf(c) { return DB.student.filter(s => String(s['기수명']) === String(c)); }
function sessionsOf(c) { return DB.session.filter(s => String(s['기수명']) === String(c)).sort((a, b) => num(a['회차']) - num(b['회차'])); }
function attendMap(c) { const m = {}; DB.attend.forEach(a => { if (String(a['기수명']) !== String(c)) return; (m[a['수강생ID']] = m[a['수강생ID']] || {})[num(a['회차'])] = a; }); return m; }
function summaryOf(c) { return DB.summary.filter(s => String(s['기수명']) === String(c)).sort((a, b) => num(a['회차']) - num(b['회차'])); }
function stageOf(s) {
  if (s['탈락일']) return '탈락'; if (s['입교일']) return '입교'; if (s['고등진급일']) return '고등';
  if (s['중등진급일']) return '중등'; if (s['센터등록일']) return '초등(등록)'; return '센터(등록전)';
}
function stageBadge(st) { const cls = { '탈락': 'bad', '입교': 'ok', '센터(등록전)': 'warn' }[st] || 'blue'; return `<span class="b ${cls}">${esc(st)}</span>`; }
function courseAt(c, date) {
  const co = cohortOf(c); if (!co || !date) return '센터';
  if (co['고등진급일'] && date >= co['고등진급일']) return '고등';
  if (co['중등진급일'] && date >= co['중등진급일']) return '중등';
  if (co['센터등록일'] && date >= co['센터등록일']) return '초등';
  return '센터';
}
function rosterAt(c, date) {
  return studentsOf(c).filter(s => !(s['탈락일'] && s['탈락일'] < date) && !(s['입교일'] && s['입교일'] < date))
    .sort((a, b) => String(a['담당전도사']).localeCompare(String(b['담당전도사'])) || String(a['이름']).localeCompare(String(b['이름'])));
}
function progressOf(c) {
  const ss = sessionsOf(c).filter(s => s['상태'] !== '휴강'); const done = ss.filter(s => s['상태'] === '완료').length;
  return { plan: ss.length, done, rate: ss.length ? done / ss.length : 0, last: ss.filter(s => s['상태'] === '완료').slice(-1)[0], next: ss.find(s => s['상태'] === '예정') };
}
function attRate(c) { const sm = summaryOf(c); let r = 0, n = 0; sm.forEach(s => { r += num(s['실시간출석']) + num(s['보강출석']); n += num(s['재적인원']); }); return n ? r / n : ''; }
function staffNames(pos) { return DB.staff.filter(s => s['상태'] !== '종료' && (!pos || s['직책'] === pos)).map(s => s['이름']); }
function cohortSelect(id, cur, onchange) {

}
function opts(list, cur, blank) { return (blank ? `<option value="">${blank === true ? '-' : blank}</option>` : '') + list.map(v => `<option ${String(v) === String(cur) ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
/** 연속 결석 2회 이상인 재적 수강생 */
function absentees(c) {
  const am = attendMap(c), ss = summaryOf(c).map(s => num(s['회차'])), out = [];
  rosterAt(c, todayStr()).forEach(s => {
    const rec = am[s['수강생ID']] || {}; let streak = 0;
    for (let i = ss.length - 1; i >= 0; i--) { const r = rec[ss[i]]; if (r && r['출석'] === '결석') streak++; else break; }

function lineChart(points, opt) {
  opt = opt || {}; const W = 640, H = opt.h || 180, P = 28;
  if (!points.length) return '<div class="empty">출석 기록이 아직 없습니다</div>';
  const xs = i => P + (points.length === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (points.length - 1));
  const ys = v => H - P - v * (H - 2 * P);
  const path = points.map((p, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.v).toFixed(1)).join(' ');
  const grid = [0, .5, 1].map(g => `<line x1="${P}" x2="${W - P}" y1="${ys(g)}" y2="${ys(g)}" stroke="#e5e7eb"/><text x="2" y="${ys(g) + 4}" font-size="10" fill="#9ca3af">${g * 100}%</text>`).join('');
  const step = Math.ceil(points.length / 12);
  const dots = points.map((p, i) => `<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3.5" fill="#2563eb"><title>${esc(p.label)}: ${pct(p.v)}</title></circle>` + (i % step === 0 ? `<text x="${xs(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#6b7280">${esc(p.x)}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${path}" fill="none" stroke="#2563eb" stroke-width="2.5"/>${dots}</svg>`;
}

function formVals(root) {

}
function fld(k, label, v, type, list, extra) {

  if (type === 'select') return `<label class="f ${extra || ''}">${label}<select data-k="${esc(k)}">${opts(list, v, true)}</select></label>`;

}

  const realRate = sm.length ? sm.reduce((a, s) => a + num(s['실시간출석']), 0) / Math.max(1, sm.reduce((a, s) => a + num(s['재적인원']), 0)) : '';

  <div class="card" style="margin-top:12px"><h3>회차별 출석률 (실시간+보강)</h3>${lineChart(pts)}</div>

let ATT_STATE = {};
PAGES.attend = () => {
  const n = ROUTE.arg || defaultCohort(); if (!n) return '<div class="card empty">먼저 기수를 만들어 주세요.</div>';
  setCohort(n);
  const ss = sessionsOf(n), sm = summaryOf(n), today = todayStr();
  let sel = ROUTE.tab ? num(ROUTE.tab) : 0;
  if (!sel) { const t = ss.find(s => s['날짜'] === today); const nxt = ss.find(s => !sm.some(x => num(x['회차']) === num(s['회차'])) && s['상태'] !== '휴강'); sel = t ? num(t['회차']) : nxt ? num(nxt['회차']) : (Math.max(0, ...ss.map(s => num(s['회차'])), ...sm.map(s => num(s['회차']))) + 1); }
  const ses = ss.find(s => num(s['회차']) === sel) || {};
  const date = ses['날짜'] || today;
  const maxNo = Math.max(0, ...ss.map(s => num(s['회차'])), ...sm.map(s => num(s['회차'])));
  const sessOpts = [];
  for (let i = 1; i <= Math.max(maxNo + 1, sel); i++) {
    const s = ss.find(x => num(x['회차']) === i), done = sm.some(x => num(x['회차']) === i);
    sessOpts.push(`<option value="${i}" ${i === sel ? 'selected' : ''}>${i}회차${s && s['날짜'] ? ' · ' + s['날짜'].slice(5) + '(' + DOW[dow(s['날짜'])] + ')' : ''}${done ? ' ✔' : ''}${s && s['상태'] === '휴강' ? ' 휴강' : ''}${!s && !done ? ' (새 회차)' : ''}</option>`);
  }

/* ── 센터 등록 판정 ── */
// 규칙: 첫 6회 수업을 모두 출석, 그중 실시간 5회 이상(보강은 1회까지)
function registerCandidates(n) {
  const sess = summaryOf(n).map(s => num(s['회차'])).sort((a, b) => a - b).slice(0, 6), am = attendMap(n);
  return studentsOf(n).filter(s => !s['탈락일']).map(s => {
    const rec = am[s['수강생ID']] || {}; let real = 0, mk = 0, ab = 0, none = 0;
    sess.forEach(no => { const r = rec[no]; if (!r) none++; else if (r['출석'] === '실시간') real++; else if (r['출석'] === '보강') mk++; else ab++; });
    let state = 'wait', why = `첫 ${sess.length}/6회 진행됨`;
    if (s['센터등록일']) { state = 'done'; why = '등록 완료 ' + s['센터등록일']; }
    else if (ab > 0 || mk > 1) { state = 'no'; why = (ab ? `결석 ${ab}회` : '') + (ab && mk > 1 ? ', ' : '') + (mk > 1 ? `보강 ${mk}회 (1회까지)` : ''); }
    else if (sess.length === 6 && none === 0 && real >= 5) { state = 'ok'; why = `실시간 ${real} · 보강 ${mk}`; }
    else if (sess.length === 6 && none > 0) { state = 'no'; why = `기록 없는 회차 ${none}개`; }
    return { s, real, mk, ab, none, state, why };
  });
}
PAGES.register = () => {
  const n = ROUTE.arg || defaultCohort(); if (!n) return '<div class="card empty">기수가 없습니다</div>';
  setCohort(n);
  const list = registerCandidates(n), c = cohortOf(n) || {};
  const lab = { ok: ['ok', '등록 가능'], no: ['bad', '요건 미달'], wait: ['warn', '진행중'], done: ['blue', '등록됨'] };
  const ok = list.filter(x => x.state === 'ok');
  return `<div class="top"><h2>센터 등록 판정</h2>${cohortSelect('rgC', n, "location.hash='register/'+encodeURIComponent(this.value)")}</div>

  <div class="row" style="margin:12px 0"><span>등록 가능 <b>${ok.length}</b>명 · 미달 <b>${list.filter(x => x.state === 'no').length}</b>명 · 진행중 <b>${list.filter(x => x.state === 'wait').length}</b>명</span><span class="sp"></span>
    <button class="btn p" ${ok.length ? '' : 'disabled'} onclick="doRegister('${esc(n)}')">등록 가능 ${ok.length}명 센터 등록 처리</button></div>
  <div class="tw"><table><tr><th>이름</th><th>담당</th><th class="c">실시간</th><th class="c">보강</th><th class="c">결석</th><th>판정</th><th>사유</th></tr>
  ${list.sort((a, b) => ['ok', 'wait', 'no', 'done'].indexOf(a.state) - ['ok', 'wait', 'no', 'done'].indexOf(b.state)).map(x => `<tr><td><b>${esc(x.s['이름'])}</b></td><td class="muted">${esc(x.s['담당전도사'] || '')}</td><td class="c">${x.real}</td><td class="c">${x.mk}</td><td class="c">${x.ab}</td><td><span class="b ${lab[x.state][0]}">${lab[x.state][1]}</span></td><td class="muted">${esc(x.why)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">수강생이 없습니다</td></tr>'}</table></div>`;
};
async function doRegister(n) {
  const c = cohortOf(n) || {}, ok = registerCandidates(n).filter(x => x.state === 'ok');

PAGES.staff = () => {

  <div class="tw" style="margin-top:12px"><table><tr><th>고유번호</th><th>이름</th><th>직책</th><th>직분</th><th>생년월일</th><th class="c">만 나이</th><th>상위자</th><th>소속팀</th><th>상태</th></tr>
  ${list.map(s => { const up = DB.staff.find(x => x['고유번호'] === s['상위자(고유번호)']); return `<tr class="click" onclick="editStaff('${esc(s['고유번호'])}')"><td class="muted">${esc(s['고유번호'])}</td><td><b>${esc(s['이름'])}</b></td><td>${esc(s['직책'] || '')}</td><td>${esc(s['직분'] || '')}</td><td>${esc(s['생년월일'] || '')}</td><td class="c">${esc(s['만나이(자동)'] === undefined ? '' : s['만나이(자동)'])}</td><td>${up ? esc(up['이름'] + ' (' + up['직책'] + ')') : ''}</td><td>${esc(s['소속팀'] || '')}</td><td><span class="b ${s['상태'] === '활동' ? 'ok' : s['상태'] === '종료' ? '' : 'warn'}">${esc(s['상태'] || '')}</span></td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">사명자가 없습니다</td></tr>'}</table></div>`;
};
function orgTree(list) {
  const act = list.filter(s => s['상태'] !== '종료'), ids = new Set(act.map(s => s['고유번호']));
  const kids = p => act.filter(s => (s['상위자(고유번호)'] || '') === p || (p === '' && s['상위자(고유번호)'] && !ids.has(s['상위자(고유번호)'])));
  const seen = new Set();
  const node = (s, depth) => { if (seen.has(s['고유번호']) || depth > 12) return ''; seen.add(s['고유번호']); const k = act.filter(x => x['상위자(고유번호)'] === s['고유번호']);
    return `<li><div class="node ${depth === 0 ? 'top' : ''}" onclick="editStaff('${esc(s['고유번호'])}')"><b>${esc(s['이름'])}</b><span>${esc(s['직책'] || '')}${s['직분'] ? ' · ' + esc(s['직분']) : ''}</span></div>${k.length ? '<ul>' + k.map(x => node(x, depth + 1)).join('') + '</ul>' : ''}</li>`; };
  const roots = kids('');
  return roots.length ? '<ul>' + roots.map(r => node(r, 0)).join('') + '</ul>' : '<div class="empty">사명자를 등록하면 조직도가 그려집니다</div>';
}
function editStaff(id) {
  const s = id ? DB.staff.find(x => x['고유번호'] === id) : { '상태': '활동' };
  const ups = DB.staff.filter(x => x['고유번호'] !== id);
  modal(`<h3>${id ? esc(s['이름']) + ' <span class="muted" style="font-size:13px">' + esc(id) + '</span>' : '새 사명자'}</h3><div id="fm" class="form">
    ${id ? `<input type="hidden" data-k="고유번호" value="${esc(id)}">` : ''}
    ${fld('이름', '이름', s['이름'])}${fld('직책', '직책', s['직책'], 'select', L('직책'))}${fld('직분', '직분', s['직분'], 'select', L('직분'))}
    ${fld('생년월일', '생년월일', s['생년월일'], 'date')}
    <label class="f">상위자<select data-k="상위자(고유번호)"><option value="">(최상위)</option>${ups.map(u => `<option value="${esc(u['고유번호'])}" ${u['고유번호'] === s['상위자(고유번호)'] ? 'selected' : ''}>${esc(u['이름'] + ' · ' + (u['직책'] || ''))}</option>`).join('')}</select></label>
    ${fld('소속팀', '소속팀', s['소속팀'])}${fld('연락처', '연락처', s['연락처'], 'tel')}${fld('상태', '상태', s['상태'], 'select', L('사명자상태'))}${fld('시작일', '시작일', s['시작일'], 'date')}${fld('비고', '비고', s['비고'], 'area')}</div>
    <div class="acts">${id ? `<button class="btn d" onclick="delStaff('${esc(id)}')">삭제</button><span class="sp"></span>` : ''}<button class="btn" onclick="closeModal()">취소</button><button class="btn p" onclick="saveStaff()">저장</button></div>`);
}
async function saveStaff() { const v = formVals($('#fm')); if (!v['이름']) return toast('이름을 입력하세요', true); if (await save('staff', [v], '사명자를 저장했습니다')) closeModal(); }
async function delStaff(id) { if (DB.staff.some(s => s['상위자(고유번호)'] === id)) return toast('이 사람을 상위자로 둔 사명자가 있습니다. 먼저 바꿔 주세요.', true); if (confirm('삭제할까요? 기록을 남기려면 상태를 「종료」로 바꾸는 것을 권합니다.')) { if (await removeRec('staff', { '고유번호': id })) closeModal(); } }

/* ── 분석 ── */
PAGES.analysis = () => {
  const tab = ROUTE.arg || 'cohort';
  const tabs = [['cohort', '기수 비교'], ['ins', '강사'], ['eva', '전도사'], ['drop', '탈락']];
  let body = '';
  if (tab === 'cohort') {
    const st = (DB.cohortStats || []).slice().sort((a, b) => String(b['개강일']).localeCompare(String(a['개강일'])));
    const cols = [['기수명', 't'], ['상태', 't'], ['수카 입고', 'n'], ['센터 등록(초등)', 'n'], ['중등 진급', 'n'], ['고등 진급', 'n'], ['입교(종강)', 'n'], ['입고→등록률', 'p'], ['등록→중등 진급률', 'p'], ['중등→고등 진급률', 'p'], ['종강률(등록→입교)', 'p'], ['평균 출석률', 'p'], ['진도율', 'p'], ['병목 구간', 't'], ['주요 탈락사유', 't']];
    body = statTable(st, cols, r => `location.hash='cohort/'+encodeURIComponent('${esc(r['기수명'])}')`);
  }
  if (tab === 'ins') body = `<p class="muted">시트 「강사분석」 기준 (분석 범위는 시트 B1 칸: 현재 기본값 「종강 기수만」)</p>` + statTable(DB.instructorStats || [], [['강사', 't'], ['담당 기수 수', 'n'], ['기수 목록', 't'], ['입고', 'n'], ['등록', 'n'], ['입교', 'n'], ['입고→등록', 'p'], ['등록→중등', 'p'], ['중등→고등', 'p'], ['고등→입교', 'p'], ['종강률(등록→입교)', 'p'], ['평균 출석률', 'p'], ['종강률 전체대비', 'd'], ['가장 약한 구간', 't']]);
  if (tab === 'eva') body = `<p class="muted">시트 「전도사분석」 기준 · 수강생별 담당전도사로 집계</p>` + statTable(DB.evangelistStats || [], [['전도사', 't'], ['담당 기수 수', 'n'], ['담당 학생(입고)', 'n'], ['등록', 'n'], ['입교', 'n'], ['탈락', 'n'], ['입고→등록', 'p'], ['등록→중등', 'p'], ['종강률(등록→입교)', 'p'], ['학생 평균 출석률', 'p'], ['종강률 전체대비', 'd'], ['주요 탈락단계', 't'], ['주요 탈락사유', 't'], ['가장 약한 구간', 't']]);
  if (tab === 'drop') {
    const d = DB.student.filter(s => s['탈락일']);
    const cnt = f => { const m = {}; d.forEach(s => { const k = f(s) || '(미입력)'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const stg = s => s['고등진급일'] ? '고등' : s['중등진급일'] ? '중등' : s['센터등록일'] ? '초등' : '센터(등록전)';
    const bars = arr => { const mx = Math.max(1, ...arr.map(x => x[1])); return arr.map(x => `<div class="hbar"><span class="t">${esc(x[0])}</span><div class="bar"><i style="width:${x[1] / mx * 100}%;background:#f87171"></i></div><b style="width:30px;text-align:right">${x[1]}</b></div>`).join('') || '<div class="muted">탈락 기록이 없습니다</div>'; };
    body = `<div class="grid g3"><div class="card"><h3>사유별 (${d.length}명)</h3>${bars(cnt(s => s['탈락사유']))}${dropGuide()}</div><div class="card"><h3>탈락 단계별</h3>${bars(cnt(stg))}</div><div class="card"><h3>담당전도사별</h3>${bars(cnt(s => s['담당전도사']))}</div><div class="card"><h3>기수별</h3>${bars(cnt(s => String(s['기수명'])))}</div></div>`;
  }
  return `<div class="top"><h2>분석</h2></div><div class="tabs">${tabs.map(t => `<a href="#analysis/${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]}</a>`).join('')}</div>${body}`;
};
function statTable(rows, cols, onclick) {
  if (!rows.length) return '<div class="card empty">데이터가 없습니다</div>';
  const cell = (v, t) => t === 'p' ? `<td class="c" style="background:${v === '' || v === undefined ? '' : num(v) < .5 ? '#fee2e2' : num(v) < .7 ? '#fef9c3' : '#dcfce7'}">${pct(v)}</td>` :
    t === 'd' ? `<td class="c" style="color:${num(v) > 0 ? 'var(--ok)' : num(v) < 0 ? 'var(--bad)' : ''}">${v === '' || v === undefined ? '-' : (num(v) > 0 ? '+' : '') + (Math.round(num(v) * 1000) / 10) + '%p'}</td>` :
    t === 'n' ? `<td class="c">${v === '' || v === undefined ? '-' : v}</td>` : `<td>${esc(v)}</td>`;
  return `<div class="tw"><table><tr>${cols.map(c => `<th class="${c[1] === 't' ? '' : 'c'}">${esc(c[0])}</th>`).join('')}</tr>${rows.map(r => `<tr class="${onclick ? 'click' : ''}" ${onclick ? `onclick="${onclick(r)}"` : ''}>${cols.map(c => cell(r[c[0]], c[1])).join('')}</tr>`).join('')}</table></div>`;
}

(function init() {
  const c = cfg();
  if (c.url && c.pw) start(); else showLogin();
  setTimeout(() => $('#lgPw') && $('#lgPw').focus(), 50);
})();
