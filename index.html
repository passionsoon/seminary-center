<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>논산 신학부 운영센터</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --ink:#191f28; --ink2:#4e5968; --sub:#8b95a1; --line:#e5e8eb; --line2:#f2f4f6;
  --pri:#3182f6; --pri-d:#1b64da; --pri-l:#e8f3ff;
  --ok:#03b26c; --ok-l:#e3f8ef; --warn:#f59f00; --warn-d:#c27a00; --warn-l:#fff4db; --bad:#f04452; --bad-l:#ffebee;
  --r:14px; --r-s:10px; --sh:0 1px 3px rgba(0,27,55,.06); --sh2:0 12px 40px rgba(0,27,55,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--pri);text-decoration:none}
.hidden{display:none!important}

/* ── 레이아웃 ── */
#app{display:flex;min-height:100vh}
#side{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.brand b{font-size:15px;line-height:1.2}.brand small{display:block;color:var(--sub);font-size:12px;font-weight:500}
.cohortPick{margin:0 4px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--line2)}
.cohortPick label{font-size:11px;color:var(--sub);font-weight:600}
.cohortPick select{width:100%;border:0;background:transparent;font-weight:700;font-size:15px;padding:2px 0;outline:none;cursor:pointer}
.navg{font-size:11px;font-weight:700;color:var(--sub);padding:12px 12px 4px}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500}
#side nav a:hover{background:var(--line2)}
#side nav a.on{background:var(--pri-l);color:var(--pri);font-weight:700}
#side nav a .ic{width:20px;text-align:center}
.sidefoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
main{display:block;flex:1;min-width:0;padding:28px 32px 120px;max-width:1280px}
#topbar,#bottombar{display:none}
@media (max-width:760px){
  #side{display:none}
  main{padding:14px 14px 110px}
  #topbar{display:flex;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;align-items:center;gap:10px}
  #topbar b{font-size:16px}
  #topbar select{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--line2);font-weight:700;max-width:46%}
  #bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottombar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);font-weight:600;padding:4px 0}
  #bottombar a .ic{font-size:20px;line-height:1}
  #bottombar a.on{color:var(--pri)}
}

/* ── 공통 ── */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--sub);font-size:14px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.ph h1{font-size:21px}.ph .acts{margin-left:0;width:100%}.ph .acts .btn{flex:1}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card+.card{margin-top:12px}
.grid>.card{margin-top:0!important}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700}
.card h3 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:6px}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:760px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}.card{padding:16px}}
.kpi{padding:16px 18px}
.kpi .l{font-size:13px;color:var(--sub);font-weight:500}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.mt{margin-top:12px}.mt2{margin-top:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--line2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri-d)}
.btn.soft{background:var(--pri-l);border-color:transparent;color:var(--pri)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--line2)}
.btn.d{color:var(--bad);border-color:transparent;background:var(--bad-l)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:14px 18px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:'';width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

input,select,textarea{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:#fff;min-width:0;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{width:100%;min-height:80px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--ink2)}
.fld>span em{font-style:normal;color:var(--sub);font-weight:500;margin-left:4px}
.fld input,.fld select{width:100%}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.search{position:relative}
.search input{padding-left:36px;width:100%}
.search::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--sub);font-size:18px}

/* ── 배지/바 ── */
.b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.b.ok{background:var(--ok-l);color:var(--ok)}.b.warn{background:var(--warn-l);color:var(--warn-d)}.b.bad{background:var(--bad-l);color:var(--bad)}.b.blue{background:var(--pri-l);color:var(--pri)}
.bar{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hbar .t{width:120px;flex-shrink:0;color:var(--ink2)}
.hbar .bar{flex:1;height:10px}
.hbar b{width:56px;text-align:right}

/* ── 표 ── */
.tw{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:2;background:#fafbfc;color:var(--sub);font-size:12px;font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f9fafb}
.c{text-align:center!important}.r{text-align:right!important}
.stick{position:sticky;left:0;background:#fff;z-index:1}
th.stick{z-index:3;background:#fafbfc}
td.wrap{white-space:normal;min-width:200px}
@media (max-width:760px){.hm{display:none}}
td input.inl,td select.inl{border-color:transparent;background:transparent;padding:6px 8px;width:100%}
td input.inl:hover,td select.inl:hover{border-color:var(--line);background:#fff}
td input.inl:focus,td select.inl:focus{border-color:var(--pri);background:#fff}
.saved{color:var(--ok);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* ── 출석 ── */
.seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer;transition:all .12s}
.seg button.on.실시간{background:var(--ok);color:#fff;box-shadow:var(--sh)}
.seg button.on.보강{background:var(--warn);color:#fff;box-shadow:var(--sh)}
.seg button.on.결석{background:var(--bad);color:#fff;box-shadow:var(--sh)}
.alist{display:flex;flex-direction:column}
.aitem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.aitem:last-child{border-bottom:0}
.aitem .who{flex:1;min-width:0}
.aitem .who b{display:block;font-size:15px}
.aitem .who span{font-size:12px;color:var(--sub)}
.aitem .extra{display:flex;gap:6px;margin-top:6px}
.aitem .extra input{padding:6px 10px;font-size:13px}
@media (max-width:520px){.aitem{flex-wrap:wrap}.aitem .seg{width:100%}.aitem .seg button{flex:1;padding:10px 0}}
.dock{position:sticky;bottom:16px;z-index:20;margin-top:16px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh2)}
.dock .cnt{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.dock .cnt b{font-size:15px}
.dock .btn{margin-left:auto}
@media (max-width:760px){.dock{bottom:84px}}
.cell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;transition:transform .1s}
.cell:hover{transform:scale(1.12)}
.cell.실시간{background:var(--ok-l);color:var(--ok)}.cell.보강{background:var(--warn-l);color:var(--warn-d)}.cell.결석{background:var(--bad-l);color:var(--bad)}.cell.none{background:var(--line2);color:#c4cad1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);align-items:center;flex-wrap:wrap}
.legend .cell{width:22px;height:22px;font-size:11px;cursor:default}
#pop{position:absolute;z-index:60;background:#fff;border-radius:14px;box-shadow:var(--sh2);padding:10px;width:240px}
#pop .t{font-size:13px;font-weight:700;margin:2px 4px 8px}
#pop .seg{display:flex}#pop .seg button{flex:1;padding:9px 0}
#pop input{width:100%;margin-top:8px;padding:7px 10px;font-size:13px}

/* ── 패널(드로어)·대화상자 ── */
#scrim{position:fixed;inset:0;background:rgba(0,19,43,.32);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
#drawer.on{transform:none;box-shadow:var(--sh2)}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
#drawer .dh h2{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0}
#drawer .dh h2 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
#drawer .db{flex:1;overflow:auto;padding:20px}
#drawer .df{display:flex;gap:8px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
#drawer .df .btn{min-width:88px}
.x{border:0;background:var(--line2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink2)}
#dialog{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(0,19,43,.32)}
#dialog .box{background:#fff;border-radius:18px;width:min(380px,100%);padding:24px;box-shadow:var(--sh2)}
#dialog h3{margin:0 0 8px;font-size:18px}
#dialog p{margin:0 0 20px;color:var(--ink2);white-space:pre-line}
#dialog .acts{display:flex;gap:8px}#dialog .acts .btn{flex:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet a{display:flex;align-items:center;gap:12px;padding:14px 8px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line2)}

/* ── 기타 ── */
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:80;font-size:14px;font-weight:600;box-shadow:var(--sh2);max-width:90vw;animation:up .2s}
#toast.err{background:var(--bad)}
@media (max-width:760px){#toast{top:62px}}
@keyframes up{from{transform:translate(-50%,-10px);opacity:0}}
#loading{position:fixed;top:0;left:0;height:3px;background:var(--pri);z-index:90;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{width:0;left:0}50%{width:60%;left:20%}100%{width:0;left:100%}}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}
.selbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh2)}
@media (max-width:760px){.selbar{bottom:84px}}
.tabs{display:flex;gap:4px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 14px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.tabs a.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stage{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.stage b{font-size:14px}
.stage input{padding:8px 10px}
.reason{display:flex;flex-direction:column;gap:6px}
.reason label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.reason label:has(input:checked){border-color:var(--pri);background:var(--pri-l)}
.reason input{margin-top:3px}
.reason b{font-size:14px}.reason small{display:block;color:var(--sub);font-size:12px}
.ccard{cursor:pointer;transition:box-shadow .15s,transform .15s}
.ccard:hover{box-shadow:0 6px 20px rgba(0,27,55,.1);transform:translateY(-1px)}
.ccard .mini{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.ccard .mini span{display:block;font-size:12px;color:var(--sub)}.ccard .mini b{font-size:17px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--line2);color:var(--ink);font-weight:600;font-size:14px}
.alert+.alert{margin-top:8px}
.alert.warn{background:var(--warn-l)}.alert.bad{background:var(--bad-l)}.alert.blue{background:var(--pri-l)}
.alert .go{margin-left:auto;color:var(--sub)}
/* 조직도 */
.org ul{padding-top:20px;position:relative;display:flex;justify-content:center;margin:0;padding-left:0}
.org li{list-style:none;text-align:center;position:relative;padding:20px 6px 0}
.org li::before,.org li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:20px}
.org li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.org li:only-child::after,.org li:only-child::before{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:2px solid var(--line);border-radius:0 8px 0 0}
.org li:first-child::after{border-radius:8px 0 0 0}
.org ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:20px}
.org .node{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-width:104px;cursor:pointer;box-shadow:var(--sh)}
.org .node:hover{border-color:var(--pri)}
.org .node b{display:block;font-size:14px}
.org .node span{font-size:12px;color:var(--sub)}
.org .node.top{background:var(--pri);border-color:var(--pri);color:#fff}.org .node.top span{color:#d6e7ff}
.orgwrap{overflow:auto;padding:4px 0 8px}
/* v3 */
svg.i{display:block;flex-shrink:0}
#side nav a .ic{display:grid;place-items:center}
#bottombar a .ic svg{width:22px;height:22px}
.sk{background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 50%,#eceff2 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
a.kpi{display:block;color:inherit;transition:box-shadow .15s}a.kpi:hover{box-shadow:0 6px 20px rgba(0,27,55,.1)}
.qbar{display:flex;align-items:center;gap:10px;background:var(--warn-l);color:var(--warn-d);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.qbar .btn{margin-left:auto}
.fu{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line2)}
.fu:last-child{border-bottom:0}
.fu .who{flex:1;min-width:0}.fu .who b{font-size:15px}
.fu .meta{font-size:13px;color:var(--sub);margin-top:2px}
.fu .memo{font-size:13px;margin-top:6px;background:var(--line2);border-radius:8px;padding:6px 10px;white-space:pre-wrap}
.fu .acts{display:flex;gap:6px;flex-shrink:0}
@media (max-width:520px){.fu{flex-wrap:wrap}.fu .acts{width:100%}.fu .acts .btn{flex:1}}
.funnel .st{display:grid;grid-template-columns:84px 1fr 64px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.funnel .st .bx{height:26px;background:var(--line2);border-radius:6px;overflow:hidden}
.funnel .st .bx i{display:block;height:100%;background:var(--pri);border-radius:0 6px 6px 0;opacity:.85}
.funnel .cv{font-size:12px;color:var(--sub);margin:-2px 0 -2px 94px}
.funnel .cv b{font-weight:700}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mbar{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.mbar .bx{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}.mbar .bx i{display:block;height:100%;background:var(--pri);border-radius:0 4px 4px 0}
.mbar b{text-align:right;font-weight:700}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip span{width:14px;height:14px;border-radius:3px;background:var(--line2)}
.strip span.실시간{background:var(--ok)}.strip span.보강{background:var(--warn)}.strip span.결석{background:var(--bad)}

#qr img{width:180px;height:180px;image-rendering:pixelated;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.rp-h{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
@media print{
  #side,#topbar,#bottombar,.noprint,#toast,#loading,.qbar{display:none!important}
  body,html{background:#fff}main{padding:0!important;max-width:none}
  .card,.tw{box-shadow:none!important;border:1px solid #e5e8eb;break-inside:avoid}
  .grid{gap:8px}.tw{overflow:visible}th{position:static}
  .g-kpi{grid-template-columns:repeat(6,1fr)}.g-2{grid-template-columns:1fr 1fr}
}

#login h1{font-size:22px;margin:16px 0 6px}

<body>

<div id="login" class="hidden">
  <div class="card">
    <div class="brand" style="padding:0"><i>신</i></div>
    <h1>논산 신학부 운영센터</h1>

    <label class="fld"><span>비밀번호</span><input id="lgPw" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></label>

</div>

<div id="app" class="hidden">
  <aside id="side">

    <nav id="nav"></nav>
    <div class="sidefoot"><span id="syncAt"></span><span class="sp"></span><button class="btn ghost sm" onclick="manualSync()" title="시트에서 새로 불러오기"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 3v4h4M4 13a8 8 0 0 0 14.6 4.5M20 21v-4h-4"/></svg></button><button class="btn ghost sm" onclick="logout()">로그아웃</button></div>
  </aside>
  <div style="flex:1;min-width:0">
    <div id="topbar"><b id="topTitle"></b><select id="cohortSelM" onchange="pickCohort(this.value)"></select></div>

  </div>
  <nav id="bottombar"></nav>
</div>
<div id="scrim" onclick="closeAll()"></div>
<aside id="drawer"><div class="dh"><h2 id="dTitle"></h2><button class="x" onclick="closeDrawer()">×</button></div><div class="db" id="dBody"></div><div class="df" id="dFoot"></div></aside>
<div id="sheet"></div>

<script>
/* ═════════ 설정 ═════════ */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwqvK_bKcaVfHq5AkIBIro7u3l-a7nDrdZqF1h8dXUg8ezL0UNXPCxDEJD-arbsv_Qu/exec';
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  check: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  book: '<path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20"/>',
  badge: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.2A5 5 0 0 1 21.5 19"/>',
  layers: '<path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/>',
  org: '<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/>',
  chart: '<path d="M3 21h18"/><path d="M6 17v-6M11 17V5M16 17v-9M21 17v-3"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.6-4.5M4 3v4h4M4 13a8 8 0 0 0 14.6 4.5M20 21v-4h-4"/>',
  print: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const icon = (k, sz) => `<svg class="i" width="${sz || 18}" height="${sz || 18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k] || ''}</svg>`;
const NAV = [
  ['운영', [['home', 'home', '대시보드'], ['attend', 'check', '출석 체크'], ['book', 'cal', '출석부'], ['followup', 'phone', '결석·보강'], ['progress', 'book', '진도'], ['register', 'badge', '등록 판정']]],
  ['사람', [['students', 'users', '수강생'], ['cohorts', 'layers', '기수 관리'], ['staff', 'org', '사명자·조직도']]],
  ['분석', [['analysis', 'chart', '분석'], ['settings', 'gear', '설정']]]
];
const CO_NAV = [['담당 기수', [['attend', 'check', '출석 체크'], ['book', 'cal', '출석부'], ['followup', 'phone', '결석·보강'], ['progress', 'book', '진도']]]];
const MOBILE_NAV = [['home', 'home', '홈'], ['attend', 'check', '출석'], ['book', 'cal', '출석부'], ['students', 'users', '수강생'], ['more', 'menu', '더보기']];
const STAGES = ['센터(등록전)', '초등(등록)', '중등', '고등', '입교', '탈락'];
const ATT = ['실시간', '보강', '결석'];
const KEYS = { staff: ['고유번호'], cohort: ['기수명'], student: ['수강생ID'], session: ['기수명', '회차'], attend: ['기록ID'], summary: ['기수명', '회차'] };
let DB = null, ROUTE = { page: 'home' }, DIRTY = false, MEMO = {};
const LINK_C = new URLSearchParams(location.search).get('c') || '';   // 기수 담당자 링크(?c=기수명)
let ROLE = { type: LINK_C ? 'cohort' : 'admin', cohort: LINK_C };
const isCo = () => ROLE.type === 'cohort';
const PWK = LINK_C ? 'dc_pw_c_' + LINK_C : 'dc_pw';
const S = { cohort: localStorage.getItem('dc_cohort') || '' };

/* ═════════ 도우미 ═════════ */
const $ = s => document.querySelector(s);
const esc = v => String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = v => (v === '' || v === null || v === undefined || isNaN(v)) ? '-' : (Math.round(v * 1000) / 10) + '%';
const num = v => (v === '' || v === null || v === undefined) ? 0 : Number(v) || 0;
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const dow = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const md = s => s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : '';
const attr = v => esc(JSON.stringify(v));
function toast(msg, err) { document.querySelectorAll('#toast').forEach(x => x.remove()); const t = document.createElement('div'); t.id = 'toast'; if (err) t.className = 'err'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2200); }
let loadingN = 0;
function loading(on) { loadingN += on ? 1 : -1; let l = $('#loading'); if (loadingN > 0 && !l) { l = document.createElement('div'); l.id = 'loading'; document.body.appendChild(l); } if (loadingN <= 0) { loadingN = 0; l && l.remove(); } }
function busy(btn, on) { if (btn) btn.classList.toggle('busy', on); }

/* ═════════ API ═════════ */
const cfg = () => ({ url: localStorage.getItem('dc_url') || DEFAULT_API, pw: sessionStorage.getItem(PWK) || localStorage.getItem(PWK) || '' });
async function api(action, payload) {
  const c = cfg(); loading(true);
  try {
    let res;
    try { res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: c.pw, action }, payload || {}, isCo() ? { cohort: ROLE.cohort } : {})) }); }
    catch (e) { const er = new Error('인터넷 연결이 불안정합니다. 잠시 후 다시 시도하세요.'); er.net = true; throw er; }
    const j = await res.json();
    if (!j.ok) { if (j.auth === false) logout(true); throw new Error(j.error || '오류가 났습니다'); }
    return j;
  } finally { loading(false); }
}
async function reload() { const j = await api('all'); DB = j.data; lastFull = Date.now(); MEMO = {}; $('#syncAt').textContent = '동기화 ' + j.at.slice(11, 16); fillCohortSel(); }
let bgTimer = null, lastFull = Date.now();
/** 저장 후에는 계산 시트(분석)만 가볍게 다시 받음. 전체 동기화는 5분마다 */
function bgSync() {
  clearTimeout(bgTimer);
  bgTimer = setTimeout(async () => {
    if (isCo()) return;
    try { const j = await api('stats'); Object.assign(DB, j.data); if (idle()) render(); } catch (e) { }
  }, 800);
}
const idle = () => !drawerOpen() && !DIRTY && !$('#pop') && !$('#dialog');
setInterval(async () => {
  if (!DB || document.hidden || !idle() || Date.now() - lastFull < 5 * 60e3) return;
  try { await reload(); if (idle()) render(); } catch (e) { }
}, 30e3);
async function manualSync() { try { await reload(); render(); toast('시트에서 새로 불러왔습니다'); } catch (e) { toast(e.message, true); } }
function keyOf(t, o) { return KEYS[t].map(k => String(o[k] === undefined ? '' : o[k])).join('|'); }
function applyRows(t, rows) {
  const list = DB[t], idx = {}; list.forEach((r, i) => idx[keyOf(t, r)] = i);
  rows.forEach(r => { const k = keyOf(t, r); if (idx[k] !== undefined) Object.assign(list[idx[k]], r); else { list.push(Object.assign({}, r)); idx[k] = list.length - 1; } });
}
async function save(table, rows, msg, btn) {
  busy(btn, true);
  try { const j = await api('upsert', { table, rows }); applyRows(table, j.rows); if (msg) toast(msg); bgSync(); return j.rows; }
  catch (e) { toast(e.message, true); return null; }
  finally { busy(btn, false); }
}
async function removeRec(table, keyValues, msg) {
  try {
    const r = await api('remove', { table, keyValues });
    const k = keyOf(table, keyValues); DB[table] = DB[table].filter(x => keyOf(table, x) !== k);
    if (table === 'student') DB.attend = DB.attend.filter(a => a['수강생ID'] !== keyValues['수강생ID']);
    if (table === 'session') { DB.attend = DB.attend.filter(a => !(String(a['기수명']) === String(keyValues['기수명']) && num(a['회차']) === num(keyValues['회차']))); DB.summary = DB.summary.filter(s => keyOf('summary', s) !== k); }
    toast((msg || '삭제했습니다') + (r.cascade ? ` · 출석기록 ${r.cascade}건 포함` : '')); bgSync(); return true;
  } catch (e) { toast(e.message, true); return false; }
}
/** 출석 저장 + 화면 즉시 반영. 인터넷이 끊기면 기기에 보관했다가 자동 재전송 */
function applyAttendLocal(p) {
  const c = p.cohort, s = num(p.session), now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  applyRows('attend', p.records.map(x => {
    const o = { '기록ID': c + '|' + s + '|' + x.studentId, '기수명': c, '회차': s, '날짜': p.date, '수강생ID': x.studentId, '이름': x.name, '출석': x.status, '기록일시': now, '수정자': isCo() ? '담당자(' + c + ')' : '관리자' };
    if (x.makeupDate !== undefined) o['보강일'] = x.makeupDate; else if (x.status !== '보강') o['보강일'] = '';
    if (x.note !== undefined) o['비고'] = x.note;
    if (x.reason !== undefined) o['결석사유'] = x.reason;
    if (x.contact !== undefined) o['연락메모'] = x.contact;
    if (x.contactDone !== undefined) o['연락완료'] = x.contactDone;
    return o;
  }));
  const th = DB.attend.filter(a => String(a['기수명']) === String(c) && num(a['회차']) === s);
  const real = th.filter(a => a['출석'] === '실시간').length, mk = th.filter(a => a['출석'] === '보강').length;
  const old = DB.summary.find(x => String(x['기수명']) === String(c) && num(x['회차']) === s) || {};
  applyRows('summary', [{ '기수명': c, '회차': s, '날짜': p.date, '과정': p.course || old['과정'] || '', '재적인원': th.length, '실시간출석': real, '보강출석': mk }]);
  const ses = DB.session.find(x => String(x['기수명']) === String(c) && num(x['회차']) === s);
  applyRows('session', [ses ? { '기수명': c, '회차': s, '상태': '완료' } : { '기수명': c, '회차': s, '날짜': p.date, '과정': p.course || '', '진도내용': p.content || '', '상태': '완료' }]);
  const per = {}; DB.attend.forEach(a => { if (String(a['기수명']) !== String(c)) return; const id = a['수강생ID']; per[id] = per[id] || [0, 0]; per[id][0]++; if (a['출석'] !== '결석') per[id][1]++; });
  DB.student.forEach(st => { if (per[st['수강생ID']]) st['출석률'] = Math.round(per[st['수강생ID']][1] / per[st['수강생ID']][0] * 1000) / 1000; });
  MEMO = {};
  return { roster: th.length, real, makeup: mk, absent: th.length - real - mk };
}
const QKEY = 'dc_queue';
const queue = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } };
const setQueue = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) { } paintQueue(); };
function paintQueue() {
  const q = queue().filter(x => !isCo() || x.p.cohort === ROLE.cohort), el = $('#qbar');
  if (el) el.innerHTML = q.length ? `<div class="qbar">⏳ 아직 보내지 못한 출석 ${q.length}건 · 인터넷이 연결되면 자동으로 보냅니다<button class="btn sm" onclick="flushQueue(true)">지금 보내기</button></div>` : '';
}
let flushing = false;
async function flushQueue(manual) {
  if (flushing) return; let q = queue(); if (!q.length) return;
  flushing = true;
  try {
    while (q.length) {
      try { await api('saveAttendance', q[0].p); q.shift(); setQueue(q); }
      catch (e) { if (e.net) { if (manual) toast('아직 인터넷이 연결되지 않았어요', true); break; } toast('보관된 출석을 보내지 못했어요: ' + e.message, true); q.shift(); setQueue(q); }
    }
    if (!queue().length) { toast('보관해 둔 출석을 모두 보냈어요'); bgSync(); }
  } finally { flushing = false; }
}
window.addEventListener('online', () => flushQueue());
setInterval(() => { if (navigator.onLine) flushQueue(); }, 30e3);
async function saveAttendance(payload, btn, opt) {
  busy(btn, true);
  try {
    const r = await api('saveAttendance', payload);
    applyAttendLocal(payload);
    if (r.rates) DB.student.forEach(st => { if (r.rates[st['수강생ID']] !== undefined) st['출석률'] = r.rates[st['수강생ID']]; });
    bgSync(); return r;
  } catch (e) {
    if (e.net && opt && opt.queue) {
      const q = queue(); q.push({ at: Date.now(), p: payload }); setQueue(q);
      const sm = applyAttendLocal(payload);
      toast('인터넷이 끊겨 기기에 보관했어요. 연결되면 자동으로 보내요.', true);
      return { queued: true, summary: sm };
    }
    toast(e.message, true); return null;
  }
  finally { busy(btn, false); }
}

/* ═════════ 로그인·라우팅 ═════════ */
function showLogin(msg) { if (LINK_C) { $('#login h1').textContent = LINK_C + ' 출석 체크'; $('#login p.muted').textContent = '담당자용 화면입니다. 이 기수의 출석과 진도를 기록하면 중앙 데이터센터에 바로 저장됩니다.'; $('#lgPw').placeholder = '담당자 비밀번호'; } $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lgUrl').value = cfg().url; $('#lgErr').textContent = msg || ''; setTimeout(() => $('#lgPw').focus(), 50); }
function logout(expired) { sessionStorage.removeItem(PWK); localStorage.removeItem(PWK); showLogin(expired ? '비밀번호를 다시 입력해 주세요.' : ''); }
$('#lgBtn').onclick = async () => {
  const url = $('#lgUrl').value.trim() || DEFAULT_API, pw = $('#lgPw').value;
  if (!pw) { $('#lgErr').textContent = '비밀번호를 입력하세요.'; return; }
  localStorage.setItem('dc_url', url); sessionStorage.setItem(PWK, pw);
  if ($('#lgKeep').checked) localStorage.setItem(PWK, pw); else localStorage.removeItem(PWK);
  busy($('#lgBtn'), true);
  try { await api('login'); await start(); }
  catch (e) { $('#lgErr').textContent = e.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.' : e.message; }
  finally { busy($('#lgBtn'), false); }
};
$('#lgPw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lgBtn').click(); });

async function start() {

function orgTree(list) {

function impParse() {

  const S2 = SETS, T = S2.tg, act = cohorts().filter(c => c['상태'] !== '종강'), trash = DB.student.filter(s => s['보관일']);
  const num3 = (k, label, v, unit) => `<label class="fld"><span>${label}</span><div class="row" style="flex-wrap:nowrap"><input type="number" data-s="${k}" value="${esc(v)}" style="width:100%"><span class="muted">${unit}</span></div></label>`;
  const chk = (k, label) => `<label class="row" style="font-weight:500"><input type="checkbox" data-s="tg.${k}" ${T[k] ? 'checked' : ''}> ${label}</label>`;
  return `<div class="card"><h3>센터 등록 판정 기준</h3><div class="setgrid">${num3('reg.n', '판정할 첫 회차 수', S2.reg.n, '회')}${num3('reg.minReal', '실시간 최소', S2.reg.minReal, '회')}${num3('reg.maxMakeup', '보강 최대', S2.reg.maxMakeup, '회')}</div></div>
  <div class="card"><h3>탈락 위험 기준</h3><div class="setgrid">${num3('risk.streak', '연속 결석(이상)', S2.risk.streak, '회')}${num3('risk.recent', '최근 몇 회', S2.risk.recent, '회')}${num3('risk.rate', '최근 출석률 미만', Math.round(S2.risk.rate * 100), '%')}</div><p class="muted" style="margin-bottom:0">둘 중 하나라도 해당하면 「위험」, 최근 3회 안에 결석이 있으면 「주의」로 표시해요.</p></div>
  <div class="card"><h3>텔레그램 알림 <small>매일 정해진 시각에 보냅니다</small></h3>
    <div class="form"><label class="fld full"><span>봇 토큰<em>@BotFather에서 받은 값</em></span><input type="password" data-s="tg.token" value="${esc(T.token)}" placeholder="123456:ABC..." autocomplete="off"></label>
      <label class="fld"><span>관리자 채팅 ID</span><input data-s="tg.adminChat" value="${esc(T.adminChat)}" placeholder="예: 123456789"></label>
      <label class="fld"><span>알림 시각</span><select data-s="tg.hour">${Array.from({ length: 17 }, (_, i) => i + 7).map(h => `<option value="${h}" ${num(T.hour) === h ? 'selected' : ''}>${h}시</option>`).join('')}</select></label></div>
    ${act.length ? `<div class="sec">기수 담당자 채팅 ID <span class="muted" style="font-weight:500">비워 두면 관리자에게만</span></div><div class="form">${act.map(c => `<label class="fld"><span>${esc(c['기수명'])}</span><input data-cc="${esc(c['기수명'])}" value="${esc((T.cohortChats || {})[c['기수명']] || '')}"></label>`).join('')}</div>` : ''}
    <div class="sec">보낼 내용</div><div style="display:grid;gap:6px">${chk('unchecked', '수업한 날 출석이 체크되지 않았을 때')}${chk('absent', '연속 결석자')}${chk('register', '센터 등록 가능 인원')}${chk('makeup', '연락하지 않은 결석')}${chk('weekly', '월요일 주간 요약')}</div>
    <div class="row mt"><button class="btn sm" onclick="tgChats(this)">채팅 ID 찾기</button><button class="btn sm" onclick="tgTest(this)">테스트 보내기</button></div><div id="tgList"></div>
    <p class="muted" style="margin-bottom:0">채팅 ID 찾는 법: 봇에게(또는 봇을 넣은 단체방에) 아무 말이나 보낸 뒤 「채팅 ID 찾기」를 누르세요.</p></div>
  <div class="card"><h3>자동 작업 <small>매일 출석률 다시 계산 · 백업 · 알림</small></h3>
    <div class="row"><span class="b ${JOB && JOB.installed ? 'ok' : 'warn'}">${JOB && JOB.installed ? '켜져 있음' : JOB && JOB.installed === null ? '권한 승인 필요' : '꺼져 있음'}</span><span class="muted">${esc((JOB && JOB.last) || '아직 실행한 적 없음')}</span></div>
    <div class="form mt"><label class="row" style="font-weight:500"><input type="checkbox" data-s="backup.on" ${S2.backup.on ? 'checked' : ''}> 매일 구글 드라이브에 시트 백업</label>${num3('backup.keep', '백업 보관 개수', S2.backup.keep, '개')}</div>
    <div class="row mt"><button class="btn sm" onclick="jobInstall(this)">${JOB && JOB.installed ? '다시 설치' : '자동 작업 켜기'}</button><button class="btn sm" onclick="jobRun(this)">지금 한 번 실행</button></div></div>
  <div class="row mt" style="justify-content:flex-end"><button class="btn p" onclick="saveSets(this)">설정 저장</button></div>
  <div class="card mt"><h3>휴지통 <small>${trash.length}명</small></h3>${trash.length ? trash.map(t => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line2)"><b>${esc(t['이름'])}</b><span class="muted">${esc(t['기수명'])} · ${md(t['보관일'])} 삭제</span><span class="sp"></span><button class="btn sm" onclick="restoreStu(${attr(t['수강생ID'])},this)">되살리기</button><button class="btn d sm" onclick="purgeStu(${attr(t['수강생ID'])})">영구 삭제</button></div>`).join('') : '<div class="muted">비어 있어요</div>'}</div>`;
}
function readSets() {
  const o = JSON.parse(JSON.stringify(SETS));
  document.querySelectorAll('[data-s]').forEach(el => { const [a, b] = el.dataset.s.split('.'); let v = el.type === 'checkbox' ? el.checked : el.value.trim(); if (el.type === 'number') v = num(v); if (a === 'risk' && b === 'rate') v = v / 100; if (b === 'hour') v = num(v); o[a][b] = v; });
  o.tg.cohortChats = Object.assign({}, o.tg.cohortChats); document.querySelectorAll('[data-cc]').forEach(el => { if (el.value.trim()) o.tg.cohortChats[el.dataset.cc] = el.value.trim(); else delete o.tg.cohortChats[el.dataset.cc]; });
  return o;
}
async function saveSets(btn) {
  const o = readSets();
  if (o.reg.n < 1 || o.reg.minReal > o.reg.n) return toast('판정 기준을 확인하세요 (실시간 최소는 회차 수 이하)', true);
  busy(btn, true);
  try {
    const hourChanged = num(o.tg.hour) !== num(SETS.tg.hour);
    SETS = (await api('saveSettings', { settings: o })).settings; DB.settings = { reg: SETS.reg, risk: SETS.risk };
    if (hourChanged && JOB && JOB.installed) JOB = await api('installJobs');
    toast('설정을 저장했어요'); render();
  } catch (e) { toast(e.message, true); } finally { busy(btn, false); }
}
async function tgChats(btn) {
  busy(btn, true);
  try { await api('saveSettings', { settings: readSets() }); const r = await api('tgChats'); $('#tgList').innerHTML = r.chats.length ? `<div class="mt">${r.chats.map(c => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line2)"><b>${esc(c.name || '(이름 없음)')}</b><span class="muted">${esc(c.id)}</span><span class="sp"></span><button class="btn sm" onclick="$('[data-s=&quot;tg.adminChat&quot;]').value='${esc(c.id)}'">관리자로</button></div>`).join('')}</div>` : '<div class="alert warn mt">아직 받은 메시지가 없어요. 봇에게 먼저 말을 걸어 주세요.</div>'; }
  catch (e) { toast(e.message, true); } finally { busy(btn, false); }
}
async function tgTest(btn) { busy(btn, true); try { SETS = (await api('saveSettings', { settings: readSets() })).settings; await api('tgTest'); toast('테스트 메시지를 보냈어요'); } catch (e) { toast(e.message, true); } finally { busy(btn, false); } }
async function jobInstall(btn) { busy(btn, true); try { SETS = (await api('saveSettings', { settings: readSets() })).settings; JOB = await api('installJobs'); toast('자동 작업을 켰어요 (매일 ' + SETS.tg.hour + '시)'); render(); } catch (e) { toast(e.message.includes('권한') || e.message.includes('ermission') ? '처음 한 번은 Apps Script에서 권한 승인이 필요해요' : e.message, true); } finally { busy(btn, false); } }
async function jobRun(btn) { busy(btn, true); try { const r = await api('runDaily', { notify: true, backup: true }); JOB = await api('jobStatus'); toast(`완료 · 출석률 ${r.report.rates}명 · 알림 ${r.report.sent}건${r.report.backup ? ' · 백업 ' + r.report.backup : ''}`); render(); } catch (e) { toast(e.message, true); } finally { busy(btn, false); } }
async function restoreStu(id, btn) { if (await save('student', [{ '수강생ID': id, '보관일': '' }], '되살렸어요', btn)) render(); }
async function purgeStu(id) { if (await ask('영구 삭제', '이 수강생과 출석 기록이 시트에서 완전히 지워지고 되돌릴 수 없어요.', '영구 삭제', true)) { if (await removeRec('student', { '수강생ID': id })) render(); } }

/* ═════════ 시작 ═════════ */
(function init() { const c = cfg(); if (c.pw) start(); else showLogin(); })();
</script>
</body>
</html>
